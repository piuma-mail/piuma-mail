name: apt install
description: >
  Installs Ubuntu packages, and keeps working when the runner's DNS can't
  resolve Ubuntu's archive (on 2026-11-11 azure.archive.ubuntu.com and
  archive.ubuntu.com both failed for over an hour): it then uses the main
  archive at an address that a public resolver gives.
inputs:
  packages:
    description: Space-separated package names.
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        if [ -f /etc/apt/apt-mirrors.txt ] && ! getent hosts azure.archive.ubuntu.com >/dev/null; then
          echo "::warning::azure.archive.ubuntu.com doesn't resolve; using archive.ubuntu.com"
          echo "http://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt
          for host in archive.ubuntu.com security.ubuntu.com; do
            if ! getent hosts "$host" >/dev/null; then
              ip=$(dig +short @1.1.1.1 "$host" A | grep -E '^[0-9.]+$' | head -1)
              if [ -n "$ip" ]; then
                echo "::warning::$host doesn't resolve either; using $ip from 1.1.1.1"
                echo "$ip $host" | sudo tee -a /etc/hosts
              fi
            fi
          done
        fi
        sudo apt-get update
        # shellcheck disable=SC2086 # one word per package
        sudo apt-get install -y -o Acquire::Retries=3 $PACKAGES
