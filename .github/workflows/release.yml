name: Release

# Manual release: publishes v0.1.0-beta.N as a GitHub prerelease with the
# Windows installer and update packages (Velopack; installed apps update from
# them) and the Android beta APK (for Obtainium or a manual install).
#
# Repository secrets, used only by the Android build step:
#   PIUMA_KEYSTORE_B64       the beta keystore, base64
#   PIUMA_KEYSTORE_PASSWORD  its password
#   (the key alias is the default, "piuma")
#
# Every action is pinned by commit (the tag in the comment): these jobs can
# write releases, which installed apps update from, and hold the APK key.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    name: Windows desktop release
    # From main only: the release tag goes on the commit that was built.
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # N in v0.1.0-beta.N counts the commits on main (+700, see
      # tools/windows-release.ps1). It must grow, or installed apps never see
      # the release as newer: a rewritten history would make it go back.
      - name: Version newer than the last beta
        shell: bash
        run: |
          next=$(( $(git rev-list --count HEAD) + 700 ))
          last=$(git tag --list 'v0.1.0-beta.*' | sed 's/^v0\.1\.0-beta\.//' | grep -E '^[0-9]+$' | sort -n | tail -1)
          echo "Next: v0.1.0-beta.$next, last: v0.1.0-beta.${last:-none}"
          if [ -n "$last" ] && [ "$next" -le "$last" ]; then
            echo "::error::v0.1.0-beta.$next is not newer than v0.1.0-beta.$last: was main's history rewritten?"
            exit 1
          fi

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          toolchain: stable

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk --version 1.2.161

      - name: Build and publish Windows release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: powershell -File tools/windows-release.ps1

  # Native build for Windows on ARM (Snapdragon PCs). Flutter builds it only
  # on an ARM64 machine. It waits for the x64 job, which creates the
  # release, then adds its own files to it (vpk upload --merge) in
  # Velopack's "win-arm64" channel, which ARM64 installs follow.
  windows-arm64:
    name: Windows ARM64 desktop release
    needs: windows
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/windows-arm64-tools
        with:
          flutter-version: 3.47.7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk --version 1.2.161

      - name: Build and add to the Windows release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: powershell -File tools/windows-release.ps1 -Arch arm64

  android:
    name: Android beta APK
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - name: Build the signed APK
        env:
          PIUMA_KEYSTORE_B64: ${{ secrets.PIUMA_KEYSTORE_B64 }}
          PIUMA_KEYSTORE_PASSWORD: ${{ secrets.PIUMA_KEYSTORE_PASSWORD }}
        run: sh tools/android-beta.sh "$RUNNER_TEMP/PiumaMail-android-arm64.apk"

      # Same commit, same count: the tag the Windows job just published.
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v0.1.0-beta.$(( $(git rev-list --count HEAD) + 700 ))"
          gh release upload "$tag" "$RUNNER_TEMP/PiumaMail-android-arm64.apk"
