name: Release

# Manual release workflow for Windows desktop. Builds installer and update
# packages with Velopack and publishes them to GitHub Releases as a prerelease.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows desktop release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk --version 1.2.161

      - name: Build and publish Windows release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PIUMA_PUBLISH: github
        run: powershell -File tools/windows-release.ps1
