name: CI

# Runs on every pull request and on main. The jobs skip themselves if the
# repository is ever private again (no Actions minutes used) unless started by
# hand; the same checks run locally before each push (see CONTRIBUTING.md).
#
# Every action is pinned by commit (the tag in the comment); Dependabot
# proposes the updates (.github/dependabot.yml).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tokens:
    name: Design tokens
    if: github.event_name == 'workflow_dispatch' || !github.event.repository.private
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generated files up to date
        run: python3 tools/gen_tokens.py --check

  core:
    name: Rust engine
    if: github.event_name == 'workflow_dispatch' || !github.event.repository.private
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev
      - run: cargo fmt --all -- --check
      # Dependabot doesn't regenerate THIRD_PARTY_RUST.md, so its pull
      # requests skip this; the Dependencies workflow checks main weekly.
      - name: Rust license list up to date
        if: github.actor != 'dependabot[bot]'
        run: python3 tools/gen_rust_licenses.py --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  app:
    name: Flutter app
    if: github.event_name == 'workflow_dispatch' || !github.event.repository.private
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - name: Screenshots of failed tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-failures
          path: app/test/failures/
          retention-days: 3

  wear:
    name: Wear OS app
    if: github.event_name == 'workflow_dispatch' || !github.event.repository.private
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wear
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  # Builds cost many minutes (macOS counts 10x, Windows 2x): they run only
  # on main or by hand, not on every PR.
  build:
    name: Build ${{ matrix.name || matrix.target }}
    needs: app
    if: github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || !github.event.repository.private)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux, os: ubuntu-latest }
          - { target: windows, os: windows-latest }
          # Flutter builds for Windows on ARM only on an ARM64 machine.
          - { target: windows, os: windows-11-arm, name: windows-arm64 }
          - { target: macos, os: macos-latest }
          - { target: apk, os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: runner.arch != 'ARM64' || runner.os != 'Windows'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      # Flutter publishes no Windows ARM64 SDK archive (flutter-action finds
      # none): the local action clones the release tag and installs Rust.
      - if: runner.arch == 'ARM64' && runner.os == 'Windows'
        uses: ./.github/actions/windows-arm64-tools
        with:
          flutter-version: 3.47.7
      - if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libwebkit2gtk-4.1-dev
      - if: matrix.target == 'apk'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - run: flutter build ${{ matrix.target }} --debug
