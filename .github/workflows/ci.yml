name: CI

# Runs on every pull request and on main once the repository is public, where
# Actions minutes are free. While it is private the jobs are skipped (no
# minutes used) unless started by hand; checks run locally before each push
# (see CONTRIBUTING.md).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tokens:
    name: Design tokens
    if: github.event_name == 'workflow_dispatch' || !github.event.repository.private
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generated files up to date
        run: python3 tools/gen_tokens.py --check

  core:
    name: Rust engine
    if: github.event_name == 'workflow_dispatch' || !github.event.repository.private
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev
      - run: cargo fmt --all -- --check
      - name: Rust license list up to date
        run: python3 tools/gen_rust_licenses.py --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  app:
    name: Flutter app
    if: github.event_name == 'workflow_dispatch' || !github.event.repository.private
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib/catalog lib/widgets lib/main.dart lib/legal.dart lib/design/theme.dart lib/design/motion.dart test
      - run: flutter analyze
      - run: flutter test
      - name: Screenshots of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-failures
          path: app/test/failures/
          retention-days: 3

  wear:
    name: Wear OS app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wear
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  # Builds cost many minutes (macOS counts 10x, Windows 2x): they run only
  # on main or by hand, not on every PR.
  build:
    name: Build ${{ matrix.name || matrix.target }}
    needs: app
    if: github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || !github.event.repository.private)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux, os: ubuntu-latest }
          - { target: windows, os: windows-latest }
          # Flutter builds for Windows on ARM only on an ARM64 machine.
          - { target: windows, os: windows-11-arm, name: windows-arm64 }
          - { target: macos, os: macos-latest }
          - { target: apk, os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - if: runner.arch != 'ARM64' || runner.os != 'Windows'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      # Flutter publishes no Windows ARM64 SDK archive (flutter-action finds
      # none): clone the release tag; its first run fetches the ARM64 Dart
      # SDK and engine. Rust comes from rustup, for the runner's own target.
      - if: runner.arch == 'ARM64' && runner.os == 'Windows'
        name: Install Flutter and Rust (Windows ARM64)
        shell: pwsh
        run: |
          git clone --depth 1 --branch 3.47.7 https://github.com/flutter/flutter.git "$env:RUNNER_TEMP\flutter"
          "$env:RUNNER_TEMP\flutter\bin" >> $env:GITHUB_PATH
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe -OutFile "$env:RUNNER_TEMP\rustup-init.exe"
            & "$env:RUNNER_TEMP\rustup-init.exe" -y --profile minimal --default-toolchain stable
            "$env:USERPROFILE\.cargo\bin" >> $env:GITHUB_PATH
          }
      - if: runner.arch == 'ARM64' && runner.os == 'Windows'
        name: Tools (Windows ARM64)
        shell: pwsh
        run: |
          flutter --version
          rustup show
          Get-Command cmake, clang, nasm, ninja -ErrorAction SilentlyContinue | Format-Table Name, Source
      - if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libwebkit2gtk-4.1-dev
      - if: matrix.target == 'apk'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - run: flutter build ${{ matrix.target }} --debug
