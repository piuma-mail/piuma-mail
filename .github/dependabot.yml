# Weekly update proposals for every dependency set in the repository.
# Version updates wait two weeks after a release (cooldown), so a hijacked
# release has time to be noticed before it reaches a pull request.
# Security updates are a separate repository setting (Settings > Code
# security > Dependabot security updates, on since 2026-11-18): they open a
# pull request as soon as an advisory has a fixed version, without the
# cooldown, and follow the groups and limits below.
# Not covered: the patched copy in third_party/fxtranslate, a path
# dependency; .github/workflows/upstream-watch.yml watches it (and
# velopack's stable releases, which deny.toml's zip ignores wait for).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      # app/rust keeps libc below 0.2.190 for iOS (see its Cargo.toml):
      # backtrace still calls functions libc 0.2.190 limits to macOS.
      - dependency-name: libc
        versions: [">= 0.2.190"]
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: deps
    open-pull-requests-limit: 5

  - package-ecosystem: pub
    directories: [/app, /wear]
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      pub:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: deps
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /relay
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      relay:
        patterns: ["*"]
    commit-message:
      prefix: deps
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directories: [/, /.github/actions/*]
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
    open-pull-requests-limit: 3
