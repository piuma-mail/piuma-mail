[package]
name = "piuma-core"
version = "0.0.1"
description = "Piuma Mail engine: protocols, sync, local database and search."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
base64 = "0.23.1"
futures = "0.3.34"
hickory-resolver = "0.26.3"
hayro = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico", "gif", "webp", "bmp", "tiff"] }
lettre = { version = "0.11.24", default-features = false, features = ["builder", "smtp-transport", "hostname", "tokio1-rustls", "aws-lc-rs"] }
mail-parser = "1.0.1"
encodify = "1.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "system-proxy", "json", "multipart"] }
roxmltree = "0.21.1"
# No default features: they only add the WebAssembly build of SQLite.
rusqlite = { version = "0.41", default-features = false, features = ["bundled", "functions", "cache"] }
rustls-platform-verifier = "0.7.1"
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
# TCP keepalive on IMAP connections (tokio leaves it out).
socket2 = "0.6.5"
thiserror = "2"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
tokio-rustls = "0.26.6"
url = "2.5.8"
whatlang = "0.18.0"
# Firefox's translation models, where the system has no translation.
# Portable kernel: the SIMD one is built for i8mm/AVX2 without a runtime
# check, which would crash older phones and PCs.
fxtranslate = { version = "0.5.0", default-features = false, features = ["download", "gemmology", "lean-embed", "mmap"] }
chacha20poly1305 = "0.11.0"
spake2 = "0.4.0"
hkdf = "0.13.0"
sha2 = "0.11.1"
# S/MIME signatures of PEC receipts (smime.rs): the crypto lettre and
# rustls already bring.
aws-lc-rs = { version = "1.18.2", default-features = false, features = ["aws-lc-sys"] }
getrandom = "0.4.3"
zeroize = { version = "1.9.1", features = ["derive"] }
bip39 = { version = "3.0.0", default-features = false, features = ["std"] }
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
resvg = { version = "0.49", default-features = false }
# The preview saved inside office documents, for the Attachments board.
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2"] }
qrcode = { version = "0.14.1", default-features = false }
rqrr = "0.11.0"

# The system's certificate check everywhere but Android, where lettre can't
# use it yet (no `new_with_extra_roots` there): Mozilla's roots instead.
[target.'cfg(not(target_os = "android"))'.dependencies]
lettre = { version = "0.11.24", default-features = false, features = ["rustls-platform-verifier"] }

# The quarantine flag on attachments saved on macOS (files.rs).
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
lettre = { version = "0.11.24", default-features = false, features = ["webpki-roots"] }
webpki-roots = "1.0.9"

[features]
# Switches only tests may use (plain http to a JMAP server on 127.0.0.1).
# Turned on for the integration tests by the dev-dependency on this crate
# below; never by the app.
test-support = []

[dev-dependencies]
piuma-core = { path = ".", features = ["test-support"] }
# As on Windows, where Velopack brings rustls with `ring`: see tls.rs.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
# test-util: paused time, so deadline tests don't wait for real.
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "test-util"] }
