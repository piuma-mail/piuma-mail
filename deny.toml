# cargo-deny: known vulnerabilities and where crates come from.
# `cargo deny check advisories sources`, run by .github/workflows/dependencies.yml.

[graph]
all-features = false

[advisories]
# Unmaintained crates count only when we depend on them directly; deeper
# ones (derivative via velopack, pin-utils via async-imap, zbus via keyring)
# are left to the crates that bring them.
unmaintained = "workspace"
yanked = "deny"
ignore = [
    # velopack 1.2.161 (desktop updates) still requires zip ^8.6. Only the
    # 1.3 prerelease (1.3.39-g8d2844f) has zip 9, and we don't ship a
    # prerelease updater. The four advisories are in zip's own extraction
    # (`ZipArchive::extract`, `ZipStreamReader::extract`: symlinks, Unix
    # permissions, an abort on a symlink entry), and zip 8 has no fix. Velopack
    # never calls them: `bundle.rs` reads each entry with `by_index` and writes
    # it itself. It also opens only the update packages of our own GitHub
    # releases. Checked on 2026-11-11. Remove these entries when a stable
    # velopack moves to zip 9, and bump the `vpk` tool in release.yml and
    # tools/windows-release.ps1 with it.
    { id = "RUSTSEC-2026-0367", reason = "zip 8.6 through velopack, which never calls zip's extract" },
    { id = "RUSTSEC-2026-0368", reason = "zip 8.6 through velopack, which never calls zip's extract" },
    { id = "RUSTSEC-2026-0369", reason = "zip 8.6 through velopack, which never calls zip's extract" },
    { id = "RUSTSEC-2026-0429", reason = "zip 8.6 through velopack, which never calls zip's extract" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
